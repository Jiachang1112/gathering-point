        // ==========================================

        const { useState, useEffect } = React;

        function FamilyApp() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [errorState, setErrorState] = useState(null);
            const { onAuthStateChanged, signInWithCustomToken, signInAnonymously } = window.firebaseModules; 

            useEffect(() => {
                const initAuth = async () => {
                    const useCustomConfig = YOUR_FIREBASE_CONFIG && YOUR_FIREBASE_CONFIG.apiKey;
                    if (!useCustomConfig && typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                        try { await signInWithCustomToken(window.auth, window.__initial_auth_token); } catch(e) { console.error(e); }
                    } else {
                        if (window.auth && !window.auth.currentUser) {
                            try { await signInAnonymously(window.auth); } catch (e) { setErrorState('auth'); }
                        }
                    }
                };
                initAuth();

                if (onAuthStateChanged && window.auth) {
                    return onAuthStateChanged(window.auth, async (currentUser) => {
                        if (currentUser) {
                            setUser(currentUser);
                            const { doc, onSnapshot } = window.firebaseModules;
                            const userRef = doc(window.db, 'artifacts', window.appId, 'users', currentUser.uid, 'profile', 'info');
                            onSnapshot(userRef, (docSnap) => {
                                if (docSnap.exists()) setUserData(docSnap.data());
                                else setUserData(null);
                                setLoading(false);
                            }, (err) => { if (err.code === 'permission-denied') setErrorState('permission'); setLoading(false); });
                        } else {
                            setUser(null); setUserData(null); setLoading(false);
                        }
                    });
                }
            }, []);

            if (errorState) return React.createElement(ErrorModal, { type: errorState });
            if (loading) return React.createElement("div", {className: "flex items-center justify-center h-screen text-gray-500"}, "載入中...");
            if (!user || !userData) return React.createElement(LoginScreen, {user, setErrorState});
            return React.createElement(Dashboard, {user, userData, setErrorState});
        }

        function ErrorModal({ type }) {
            const isAuthError = type === 'auth';
            return React.createElement("div", {className: "fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"},
                React.createElement("div", {className: "bg-white p-6 rounded-2xl max-w-md w-full shadow-2xl"},

                        React.createElement("div", {className: "w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-4 text-red-500"}, React.createElement(Icons.Alert, {size: 40})),

                        React.createElement("p", {className: "text-gray-600 mt-2"}, "請聯絡管理員修復。")

                    React.createElement("button", {onClick: () => window.location.reload(), className: "w-full mt-6 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700"}, "重新整理")
                )
            );
        }

        function LoginScreen({ user, setErrorState }) {
            const [name, setName] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const { doc, setDoc } = window.firebaseModules;

            const handleJoin = async (e) => {
                e.preventDefault();
                if (!name.trim() || !user) return;
                setIsSubmitting(true);
                try {
                    const profileData = { name: name, role: 'kid', points: 0, uid: user.uid, joinedAt: new Date().toISOString() };
                    await setDoc(doc(window.db, 'artifacts', window.appId, 'users', user.uid, 'profile', 'info'), profileData);
                    await setDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'members', user.uid), profileData);
                } catch (error) {
                    if (error.code === 'permission-denied') setErrorState('permission');
                    else alert("設定失敗");
                } finally { setIsSubmitting(false); }
            };

            return (
                React.createElement("div", {className: "min-h-screen bg-gradient-to-b from-blue-100 to-white flex flex-col items-center justify-center p-6"},
                    React.createElement("div", {className: "bg-white w-full max-w-md p-8 rounded-2xl shadow-xl"},
                        React.createElement("h1", {className: "text-3xl font-bold text-center text-blue-600 mb-2"}, "家庭集點通 🏠"),
                        React.createElement("p", {className: "text-center text-gray-500 mb-8"}, "我是成員"),
                        React.createElement("form", {onSubmit: handleJoin, className: "space-y-6"},
                            React.createElement("div", null,
                                React.createElement("label", {className: "block text-sm font-medium text-gray-700 mb-2"}, "你的名字"),
                                React.createElement("input", {type: "text", required: true, className: "w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none", placeholder: "例如：小明", value: name, onChange: (e) => setName(e.target.value)})
                            ),
                            React.createElement("button", {type: "submit", disabled: isSubmitting, className: "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg disabled:opacity-50"}, isSubmitting ? '建立中...' : '開始使用')
                        )
                    )
                )
            );
        }

        function Dashboard({ user, userData, setErrorState }) {
            const [activeTab, setActiveTab] = useState('home');

            const renderContent = () => {
                switch (activeTab) {
                    case 'home': return React.createElement(HomeTab, {user, userData});
                    case 'chores': return React.createElement(ChoresTab, {user, userData, setErrorState});
                    case 'rewards': return React.createElement(RewardsTab, {user, userData, setErrorState});
                    default: return React.createElement(HomeTab, {user, userData});
                }
            };

            return (
                React.createElement("div", {className: "min-h-screen bg-gray-50 flex flex-col max-w-md mx-auto shadow-2xl overflow-hidden relative"},
                    React.createElement("div", {className: "flex-1 overflow-y-auto pb-24"}, renderContent()),
                    React.createElement("div", {className: "fixed bottom-0 w-full max-w-md bg-white border-t border-gray-200 flex justify-around py-3 pb-safe z-50 shadow-[0_-5px_10px_rgba(0,0,0,0.05)]"},
                        React.createElement(NavButton, {icon: React.createElement(Icons.QrCode), label: "我的卡片", isActive: activeTab === 'home', onClick: () => setActiveTab('home')}),
                        React.createElement(NavButton, {icon: React.createElement(Icons.CheckSquare), label: "家事板", isActive: activeTab === 'chores', onClick: () => setActiveTab('chores')}),
                        React.createElement(NavButton, {icon: React.createElement(Icons.Gift), label: "兌換獎勵", isActive: activeTab === 'rewards', onClick: () => setActiveTab('rewards')})
                    )
                )
            );
        }

        function NavButton({ icon, label, isActive, onClick }) {
            return (
                React.createElement("button", {onClick: onClick, className: `flex flex-col items-center gap-1 w-16 transition-colors ${isActive ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600'}`},

                    React.createElement("span", {className: "text-[10px] font-medium"}, label)

            );
        }

        function HomeTab({ user, userData }) {
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${user.uid}`;
            return (
                React.createElement("div", {className: "p-6 flex flex-col items-center pt-10"},
                    React.createElement("div", {className: "w-full flex justify-between items-center mb-8"},
                        React.createElement("div", null,
                            React.createElement("h2", {className: "text-2xl font-bold text-gray-800"}, `你好，${userData.name} 👋`),
                            React.createElement("span", {className: "inline-block px-3 py-1 rounded-full text-xs font-bold mt-1 bg-blue-100 text-blue-700"}, "🌟 成員")
                        ),
                        React.createElement("button", {onClick: () => window.location.reload(), className: "p-2 bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200"}, React.createElement(Icons.LogOut, {size: 20}))

                    React.createElement("div", {className: "w-full bg-gradient-to-r from-blue-500 to-indigo-600 rounded-2xl p-6 text-white shadow-lg mb-8 relative overflow-hidden"},

                        React.createElement("p", {className: "text-blue-100 text-sm font-medium mb-1"}, "目前點數"),
                        React.createElement("h3", {className: "text-5xl font-bold mb-4"}, userData.points, React.createElement("span", {className: "text-2xl opacity-80"}, " pt"))
                    ),
                    React.createElement("div", {className: "bg-white p-6 rounded-2xl shadow-lg border border-gray-100 flex flex-col items-center w-full"},
                        React.createElement("h4", {className: "font-bold text-gray-800 mb-4 flex items-center gap-2"}, React.createElement(Icons.Scan, {size: 20, className: "text-blue-500"}), "讓爸媽掃描加點"),
                        React.createElement("div", {className: "bg-gray-50 p-4 rounded-xl border border-gray-100 mb-4"}, React.createElement("img", {src: qrUrl, alt: "User QR", className: "w-48 h-48 mix-blend-multiply"})),
                        React.createElement("p", {className: "text-xs text-center text-gray-400"}, `ID: ${user.uid.slice(0, 8)}...`)
                    )
                )
            );
        }

        function ChoresTab({ user, userData, setErrorState }) {
            const [chores, setChores] = useState([]);
            const { collection, onSnapshot, updateDoc, doc } = window.firebaseModules;

            useEffect(() => {
                const unsub = onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'chores'), (snap) => {
                    let list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    setChores(list);
                }, (err) => { if (err.code === 'permission-denied') setErrorState('permission'); });
                return () => unsub();
            }, []);

            const toggleChore = async (chore) => {
                const ref = doc(window.db, 'artifacts', window.appId, 'public', 'data', 'chores', chore.id);
                try {
                    if (!chore.completed) await updateDoc(ref, { completed: true, completedBy: userData.name });
                    else await updateDoc(ref, { completed: false, completedBy: null });
                } catch(e) { if (e.code === 'permission-denied') setErrorState('permission'); }
            };

            return (
                React.createElement("div", {className: "p-6"},
                    React.createElement("h2", {className: "text-2xl font-bold mb-6"}, "家事公佈欄 🧹"),
                    React.createElement("div", {className: "space-y-3"},
                        chores.map(chore => {
                            const isAssignedToMe = chore.assignee?.uid === user.uid;
                            return (
                                React.createElement("div", {key: chore.id, className: `flex items-center justify-between p-4 rounded-xl border relative overflow-hidden ${chore.completed ? 'bg-green-50 opacity-80' : isAssignedToMe ? 'bg-blue-50 border-blue-200' : 'bg-white'}`},
                                    isAssignedToMe && !chore.completed && React.createElement("div", {className: "absolute left-0 top-0 bottom-0 w-1 bg-blue-500"}),
                                    React.createElement("div", {className: "flex items-center gap-3 flex-1"},
                                        React.createElement("button", {onClick: () => toggleChore(chore), className: `w-6 h-6 rounded border flex items-center justify-center ${chore.completed ? 'bg-green-500 border-green-500 text-white' : 'bg-white'}`}, React.createElement(Icons.CheckSquare, {size: 16})),
                                        React.createElement("div", {className: "flex flex-col"},
                                            React.createElement("div", {className: "flex items-center gap-2 flex-wrap"},
                                                React.createElement("span", {className: chore.completed ? 'line-through text-gray-500' : ''}, chore.title),
                                                chore.assignee && !chore.completed && React.createElement("span", {className: `text-[10px] px-2 rounded-full ${isAssignedToMe ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-500'}`}, isAssignedToMe ? '👉 你的任務' : `給 ${chore.assignee.name}`)
                                            ),
                                            chore.completed && React.createElement("span", {className: "text-xs text-green-600"}, `由 ${chore.completedBy} 完成`)
                                        )
                                    )
                                )
                            );
                        })
                    )
                )
            );
        }

        function RewardsTab({ user, userData, setErrorState }) {
            const [rewards, setRewards] = useState([]);
            const { collection, onSnapshot, updateDoc, doc, increment } = window.firebaseModules;

            useEffect(() => {
                const unsub = onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'rewards'), (snap) => {
                    let list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => a.cost - b.cost);
                    setRewards(list);
                }, (err) => { if (err.code === 'permission-denied') setErrorState('permission'); });
                return () => unsub();
            }, []);

            const redeemReward = async (reward) => {
                if (userData.points < reward.cost || !confirm(`兌換 ${reward.title}?`)) return;
                const inc = increment(-reward.cost);
                try {
                    await updateDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'members', user.uid), { points: inc });
                    await updateDoc(doc(window.db, 'artifacts', window.appId, 'users', user.uid, 'profile', 'info'), { points: inc });
                    alert("兌換成功！");
                } catch(e) { if (e.code === 'permission-denied') setErrorState('permission'); else alert("失敗"); }
            };

            return (
                React.createElement("div", {className: "p-6"},
                    React.createElement("h2", {className: "text-2xl font-bold mb-6"}, "獎勵兌換 🎁"),
                    React.createElement("div", {className: "grid grid-cols-2 gap-4"},
                        rewards.map(r => (
                            React.createElement("div", {key: r.id, className: "bg-white p-4 rounded-xl shadow-sm border flex flex-col justify-between h-40 relative"},
                                React.createElement("div", {className: "text-center"},
                                    React.createElement("div", {className: "text-4xl mb-2"}, r.icon),
                                    React.createElement("h3", {className: "font-bold"}, r.title)
                                ),
                                React.createElement("button", {onClick: () => redeemReward(r), disabled: userData.points < r.cost, className: `w-full py-2 rounded text-sm font-bold mt-2 ${userData.points >= r.cost ? 'bg-blue-50 text-blue-600' : 'bg-gray-100 text-gray-400'}`}, `${r.cost} 點`)
                            )
                        ))
                    )
                )
            );
        }
    </script>
