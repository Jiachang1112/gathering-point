            const [scanResult, setScanResult] = useState(null);
            const [amount, setAmount] = useState(10);
            const [targetUser, setTargetUser] = useState(null);
            const [status, setStatus] = useState('idle');
            const { doc, getDoc, updateDoc, increment } = window.firebaseModules;

            useEffect(() => {
                if (scanResult) return;
                const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
                scanner.render((decodedText) => {
                    scanner.clear();
                    setScanResult(decodedText);
                    fetchTargetUser(decodedText);
                }, (error) => {});
                return () => { try { scanner.clear(); } catch(e){} };
            }, [scanResult]);

            const fetchTargetUser = async (uid) => {
                setStatus('processing');
                try {
                    const docSnap = await getDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'members', uid));
                    if (docSnap.exists()) {
                        setTargetUser(docSnap.data());
                        setStatus('idle');
                    } else {
                        setStatus('error');
                        alert("找不到此用戶資料");
                        setScanResult(null);
                    }
                } catch (e) {
                    console.error(e);
                    if (e.code === 'permission-denied') setErrorState('permission');
                    setStatus('error');
                    setScanResult(null);
                }
            };

            const handleGivePoints = async () => {
                if (!targetUser || !amount) return;
                setStatus('processing');
                try {
                    const inc = increment(parseInt(amount));
                    await updateDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'members', targetUser.uid), { points: inc });
                    await updateDoc(doc(window.db, 'artifacts', window.appId, 'users', targetUser.uid, 'profile', 'info'), { points: inc });
                    setStatus('success');
                    setTimeout(() => { setScanResult(null); setTargetUser(null); setStatus('idle'); }, 2000);
                } catch (error) { 
                    console.error(error);
                    if (error.code === 'permission-denied') setErrorState('permission');
                    else alert("發送失敗"); 
                    setStatus('idle'); 
                }
            };

            if (userData.role !== 'parent') return React.createElement("div", {className: "p-8 text-center text-gray-500"}, "權限不足");

            return (
                React.createElement("div", {className: "p-4 h-full flex flex-col"},
                    React.createElement("h2", {className: "text-xl font-bold mb-4 text-center"}, "掃描加點"),
                    !scanResult ? (
                        React.createElement("div", {className: "flex-1 bg-black rounded-2xl overflow-hidden relative"}, React.createElement("div", {id: "reader", className: "w-full h-full text-white"}))
                    ) : (
                        React.createElement("div", {className: "flex-1 bg-white rounded-2xl shadow-lg p-6 flex flex-col items-center"},
                            status === 'success' ? (
                                React.createElement("div", {className: "text-center py-10"}, React.createElement("h3", {className: "text-2xl font-bold text-green-600"}, "發送成功！"))
                            ) : (
                                React.createElement(React.Fragment, null,
                                    React.createElement("h3", {className: "text-xl font-bold mb-1"}, `給 ${targetUser?.name} 點數`),
                                    React.createElement("div", {className: "w-full space-y-4 mt-4"},
                                        React.createElement("div", null,
                                            React.createElement("div", {className: "flex gap-2"},
                                                [10, 20, 50, 100].map(val => (
                                                    React.createElement("button", {key: val, onClick: () => setAmount(val), className: `flex-1 py-2 rounded border font-bold ${amount === val ? 'bg-blue-600 text-white' : ''}`}, val)
                                                ))
                                            ),
                                            React.createElement("input", {type: "number", value: amount, onChange: e => setAmount(e.target.value), className: "w-full mt-2 p-3 border rounded text-center text-lg font-bold"})
                                        ),
                                        React.createElement("div", {className: "flex gap-3 mt-6"},
                                            React.createElement("button", {onClick: () => { setScanResult(null); setTargetUser(null); }, className: "flex-1 py-3 bg-gray-100 rounded"}, "取消"),
                                            React.createElement("button", {onClick: handleGivePoints, disabled: status === 'processing', className: "flex-1 py-3 bg-blue-600 text-white rounded shadow"}, status === 'processing' ? '...' : '確認')
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        function ChoresTab({ user, userData, setErrorState }) {
            const [chores, setChores] = useState([]);
            const [newChore, setNewChore] = useState('');
            const [members, setMembers] = useState([]);
            const [selectedAssignee, setSelectedAssignee] = useState('');
            const { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } = window.firebaseModules;

            useEffect(() => {
                const unsub = onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'chores'), (snap) => {
                    let list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    setChores(list);
                }, (err) => {
                    console.error("Chores Error:", err);
                    if (err.code === 'permission-denied') setErrorState('permission');
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                const unsub = onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'members'), (snap) => {
                    setMembers(snap.docs.map(doc => ({ uid: doc.id, ...doc.data() })));
                }, (err) => {
                    console.error("Members Error:", err);
                    if (err.code === 'permission-denied') setErrorState('permission');
                });
                return () => unsub();
            }, []);

            const addChore = async () => {
                if (!newChore.trim()) return;
                let assigneeData = null;
                if (selectedAssignee) {
                    const member = members.find(m => m.uid === selectedAssignee);
                    if (member) assigneeData = { uid: member.uid, name: member.name };
                }
                try {
                    await addDoc(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'chores'), {
                        title: newChore, completed: false, completedBy: null, createdAt: new Date().toISOString(), assignee: assigneeData
                    });
                    setNewChore(''); setSelectedAssignee('');
                } catch(e) {
                    console.error(e);
                    if (e.code === 'permission-denied') setErrorState('permission');
                }
            };

            const toggleChore = async (chore) => {
                const ref = doc(window.db, 'artifacts', window.appId, 'public', 'data', 'chores', chore.id);
                try {
                    if (!chore.completed) await updateDoc(ref, { completed: true, completedBy: userData.name });
                    else await updateDoc(ref, { completed: false, completedBy: null });
                } catch(e) {
                    console.error(e);
                    if (e.code === 'permission-denied') setErrorState('permission');
                }
            };

            const deleteChore = async (id) => { 
                if (confirm('刪除？')) {
                    try {
                        await deleteDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'chores', id)); 
                    } catch(e) {
                        console.error(e);
                        if (e.code === 'permission-denied') setErrorState('permission');
                    }
                }
            };

            return (
                React.createElement("div", {className: "p-6"},
                    React.createElement("h2", {className: "text-2xl font-bold mb-6"}, "家事公佈欄 🧹"),
                    React.createElement("div", {className: "bg-white p-3 rounded-xl shadow-sm border mb-6"},
                        React.createElement("div", {className: "flex gap-2 mb-2"},
                            React.createElement("input", {type: "text", value: newChore, onChange: (e) => setNewChore(e.target.value), placeholder: "新增家事...", className: "flex-1 px-4 py-2 border rounded-lg outline-none"}),
                            React.createElement("button", {onClick: addChore, className: "bg-blue-600 text-white p-2 rounded-lg"}, React.createElement(Icons.Plus))
                        ),
                        userData.role === 'parent' && (
                            React.createElement("div", {className: "flex items-center gap-2 text-sm text-gray-600"},
                                React.createElement("span", {className: "text-xs font-bold bg-gray-100 px-2 py-1 rounded"}, "指定給:"),
                                React.createElement("select", {value: selectedAssignee, onChange: (e) => setSelectedAssignee(e.target.value), className: "flex-1 bg-transparent py-1 outline-none"},
                                    React.createElement("option", {value: ""}, "所有人"),
                                    members.map(m => React.createElement("option", {key: m.uid, value: m.uid}, m.name))
                                )
                            )
                        )
                    ),
                    React.createElement("div", {className: "space-y-3"},
                        chores.map(chore => {
                            const isAssignedToMe = chore.assignee?.uid === user.uid;
                            return (
                                React.createElement("div", {key: chore.id, className: `flex items-center justify-between p-4 rounded-xl border relative overflow-hidden ${chore.completed ? 'bg-green-50 opacity-80' : isAssignedToMe ? 'bg-blue-50 border-blue-200' : 'bg-white'}`},
                                    isAssignedToMe && !chore.completed && React.createElement("div", {className: "absolute left-0 top-0 bottom-0 w-1 bg-blue-500"}),
                                    React.createElement("div", {className: "flex items-center gap-3 flex-1"},
                                        React.createElement("button", {onClick: () => toggleChore(chore), className: `w-6 h-6 rounded border flex items-center justify-center ${chore.completed ? 'bg-green-500 border-green-500 text-white' : 'bg-white'}`}, React.createElement(Icons.CheckSquare, {size: 16})),
                                        React.createElement("div", {className: "flex flex-col"},
                                            React.createElement("div", {className: "flex items-center gap-2 flex-wrap"},
                                                React.createElement("span", {className: chore.completed ? 'line-through text-gray-500' : ''}, chore.title),
                                                chore.assignee && !chore.completed && React.createElement("span", {className: `text-[10px] px-2 rounded-full ${isAssignedToMe ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-500'}`}, isAssignedToMe ? '👉 你的任務' : `給 ${chore.assignee.name}`)
                                            ),
                                            chore.completed && React.createElement("span", {className: "text-xs text-green-600"}, `由 ${chore.completedBy} 完成`)
                                        )
                                    ),
                                    React.createElement("button", {onClick: () => deleteChore(chore.id), className: "text-gray-300 hover:text-red-400"}, React.createElement(Icons.Trash2, {size: 16}))
                                )
                            );
                        })
                    )
                )
            );
        }

        function RewardsTab({ user, userData, setErrorState }) {
            const [rewards, setRewards] = useState([]);
            const [isAdding, setIsAdding] = useState(false);
            const [newReward, setNewReward] = useState({ name: '', cost: 50 });
            const { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, increment } = window.firebaseModules;

            useEffect(() => {
                const unsub = onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'rewards'), (snap) => {
                    let list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => a.cost - b.cost);
                    setRewards(list);
                }, (err) => {
                    console.error("Rewards Error:", err);
                    if (err.code === 'permission-denied') setErrorState('permission');
                });
                return () => unsub();
            }, []);

            const addReward = async () => {
                if (!newReward.name.trim()) return;
                try {
                    await addDoc(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'rewards'), {
                        title: newReward.name, cost: parseInt(newReward.cost), icon: '🎁'
                    });
                    setNewReward({ name: '', cost: 50 }); setIsAdding(false);
                } catch(e) {
                    console.error(e);
                    if (e.code === 'permission-denied') setErrorState('permission');
                }
            };

            const redeemReward = async (reward) => {
                if (userData.points < reward.cost || !confirm(`兌換 ${reward.title}?`)) return;
                const inc = increment(-reward.cost);
                try {
                    await updateDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'members', user.uid), { points: inc });
                    await updateDoc(doc(window.db, 'artifacts', window.appId, 'users', user.uid, 'profile', 'info'), { points: inc });
                    alert("兌換成功！");
                } catch(e) { 
                    console.error(e);
                    if (e.code === 'permission-denied') setErrorState('permission');
                    else alert("失敗"); 
                }
            };

            const deleteReward = async(id) => { 
                if(confirm("刪除?")) {
                    try {
                        await deleteDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rewards', id));
                    } catch(e) {
                        console.error(e);
                        if (e.code === 'permission-denied') setErrorState('permission');
                    }
                }
            };

            return (
                React.createElement("div", {className: "p-6"},
                    React.createElement("div", {className: "flex justify-between items-center mb-6"},
                        React.createElement("h2", {className: "text-2xl font-bold"}, "獎勵兌換 🎁"),
                        userData.role === 'parent' && React.createElement("button", {onClick: () => setIsAdding(!isAdding), className: "text-sm bg-gray-100 px-3 py-1 rounded-full"}, isAdding ? '取消' : '新增')
                    ),
                    isAdding && (
                        React.createElement("div", {className: "bg-gray-50 p-4 rounded-xl mb-6 border"},
                            React.createElement("input", {className: "w-full mb-2 p-2 border rounded", placeholder: "名稱", value: newReward.name, onChange: e => setNewReward({...newReward, name: e.target.value})}),
                            React.createElement("div", {className: "flex gap-2"},
                                React.createElement("input", {type: "number", className: "w-24 p-2 border rounded", value: newReward.cost, onChange: e => setNewReward({...newReward, cost: e.target.value})}),
                                React.createElement("button", {onClick: addReward, className: "flex-1 bg-blue-600 text-white rounded"}, "新增")
                            )
                        )
                    ),
                    React.createElement("div", {className: "grid grid-cols-2 gap-4"},
                        rewards.map(r => (
                            React.createElement("div", {key: r.id, className: "bg-white p-4 rounded-xl shadow-sm border flex flex-col justify-between h-40 relative"},
                                userData.role === 'parent' && React.createElement("button", {onClick: (e) => {e.stopPropagation(); deleteReward(r.id)}, className: "absolute top-2 right-2 text-gray-300"}, React.createElement(Icons.Trash2, {size: 14})),
                                React.createElement("div", {className: "text-center"},
                                    React.createElement("div", {className: "text-4xl mb-2"}, r.icon),
                                    React.createElement("h3", {className: "font-bold"}, r.title)
                                ),
                                React.createElement("button", {onClick: () => redeemReward(r), disabled: userData.points < r.cost, className: `w-full py-2 rounded text-sm font-bold mt-2 ${userData.points >= r.cost ? 'bg-blue-50 text-blue-600' : 'bg-gray-100 text-gray-400'}`}, `${r.cost} 點`)
                            )
                        ))
                    )
                )
            );
        }
    </script>
</body>
</html>
