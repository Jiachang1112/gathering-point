                                    )
                                ),
                                React.createElement("button", {onClick: () => deleteChore(chore.id), className: "text-gray-300 hover:text-red-400"}, React.createElement(Icons.Trash2, {size: 16}))
                            )
                        ))
                    )
                )
            );
        }

        function RewardsTab({ user, userData, setErrorState }) {
            const [rewards, setRewards] = useState([]);
            const [isAdding, setIsAdding] = useState(false);
            const [newReward, setNewReward] = useState({ name: '', cost: 50 });
            const { collection, onSnapshot, addDoc, deleteDoc, doc, increment, updateDoc } = window.firebaseModules;

            useEffect(() => {
                const unsub = onSnapshot(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'rewards'), (snap) => {
                    let list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    list.sort((a, b) => a.cost - b.cost);
                    setRewards(list);
                }, (err) => { if (err.code === 'permission-denied') setErrorState('permission'); });
                return () => unsub();
            }, []);

            const addReward = async () => {
                if (!newReward.name.trim()) return;
                try {
                    await addDoc(collection(window.db, 'artifacts', window.appId, 'public', 'data', 'rewards'), { title: newReward.name, cost: parseInt(newReward.cost), icon: '🎁' });
                    setNewReward({ name: '', cost: 50 }); setIsAdding(false);
                } catch(e) { if (e.code === 'permission-denied') setErrorState('permission'); }
            };

            const deleteReward = async(id) => { 
                if(confirm("確定刪除此獎勵?")) {
                    try { await deleteDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rewards', id)); } 
                    catch(e) { if (e.code === 'permission-denied') setErrorState('permission'); }
                }
            };
            
            const redeemReward = async (reward) => {
                 // 管理員測試兌換
                if (userData.points < reward.cost || !confirm(`測試兌換 ${reward.title}?`)) return;
                const inc = increment(-reward.cost);
                try {
                    await updateDoc(doc(window.db, 'artifacts', window.appId, 'public', 'data', 'members', user.uid), { points: inc });
                    await updateDoc(doc(window.db, 'artifacts', window.appId, 'users', user.uid, 'profile', 'info'), { points: inc });
                } catch(e) { alert("失敗"); }
            };

            return (
                React.createElement("div", {className: "p-6"},
                    React.createElement("div", {className: "flex justify-between items-center mb-6"},
                        React.createElement("h2", {className: "text-2xl font-bold"}, "獎勵管理 🎁"),
                        React.createElement("button", {onClick: () => setIsAdding(!isAdding), className: "text-sm bg-purple-100 text-purple-700 px-3 py-1 rounded-full"}, isAdding ? '取消' : '新增')
                    ),
                    isAdding && (
                        React.createElement("div", {className: "bg-gray-50 p-4 rounded-xl mb-6 border"},
                            React.createElement("input", {className: "w-full mb-2 p-2 border rounded", placeholder: "名稱", value: newReward.name, onChange: e => setNewReward({...newReward, name: e.target.value})}),
                            React.createElement("div", {className: "flex gap-2"},
                                React.createElement("input", {type: "number", className: "w-24 p-2 border rounded", value: newReward.cost, onChange: e => setNewReward({...newReward, cost: e.target.value})}),
                                React.createElement("button", {onClick: addReward, className: "flex-1 bg-purple-600 text-white rounded"}, "新增")
                            )
                        )
                    ),
                    React.createElement("div", {className: "grid grid-cols-2 gap-4"},
                        rewards.map(r => (
                            React.createElement("div", {key: r.id, className: "bg-white p-4 rounded-xl shadow-sm border flex flex-col justify-between h-40 relative"},
                                React.createElement("button", {onClick: (e) => {e.stopPropagation(); deleteReward(r.id)}, className: "absolute top-2 right-2 text-gray-300 hover:text-red-500"}, React.createElement(Icons.Trash2, {size: 14})),
                                React.createElement("div", {className: "text-center"},
                                    React.createElement("div", {className: "text-4xl mb-2"}, r.icon),
                                    React.createElement("h3", {className: "font-bold"}, r.title)
                                ),
                                React.createElement("div", {className: "text-center text-sm font-bold text-gray-400 mt-2"}, `${r.cost} 點`)
                            )
                        ))
                    )
                )
            );
        }
    </script>
</body>
</html>
